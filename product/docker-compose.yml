services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: podacha
      POSTGRES_USER: podacha
      POSTGRES_PASSWORD: podacha
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podacha"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
